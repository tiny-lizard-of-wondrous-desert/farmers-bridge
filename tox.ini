[tox]
envlist = lint, py311, py312, py313, dev, local, online
requires = tox>=4

[testenv]
description = Run unit and integration tests
package = skip
deps =
    -r requirements-dev.txt
commands = pytest {posargs}

[testenv:dev]
description = Run tests, Ruff lint and formatting checks
deps =
    -r requirements-dev.txt
commands =
    pytest {posargs}
    ruff check .
    ruff format --check .

[testenv:local]
description = Test the local Pygame interface dependencies
deps =
    -r requirements-dev.txt
    -r requirements-local.txt
commands = pytest {posargs}

[testenv:online]
description = Test the Streamlit online dependencies
deps =
    -r requirements-dev.txt
    -r requirements.txt
commands = pytest {posargs}

[testenv:lint]
description = Run Ruff lint and formatting checks
deps =
    -r requirements-dev.txt
commands =
    ruff check .
    ruff format --check .
