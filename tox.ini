[tox]
envlist = lint, py311, py312, py313
requires = tox>=4

[testenv]
description = Run unit and integration tests
package = skip
deps = pytest>=8.0
commands = pytest {posargs}

[testenv:lint]
description = Run Ruff formatting and lint checks
skip_install = true
deps = ruff>=0.8
commands =
    ruff check .
    ruff format --check .
