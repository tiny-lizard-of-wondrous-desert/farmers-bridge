[tox]
envlist = lint, dev, local, online
requires = tox>=4

[testenv]
description = Run unit and integration tests with uv dependency groups
skip_install = true
allowlist_externals = uv

[testenv:dev]
description = Run tests, Ruff lint and formatting checks
commands =
    uv run --group dev pytest {posargs}
    uv run --group dev ruff check .
    uv run --group dev ruff format --check .

[testenv:local]
description = Test the local Pygame interface dependencies
commands =
    uv run --group dev --group local pytest {posargs}

[testenv:online]
description = Test the Streamlit online dependencies
commands =
    uv run --group dev --group online pytest {posargs}

[testenv:lint]
description = Run Ruff lint and formatting checks
commands =
    uv run --group dev ruff check .
    uv run --group dev ruff format --check .
