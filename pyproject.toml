[project]
name = "farmers-bridge"
version = "0.2.0"
description = "A multi-interface trick-taking card game"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false
default-groups = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "tox>=4",
    "uv>=0.13.10",
    "pre-commit>=3.5",
]
local = [
    "pygame>=2.6.1",
    "pygame-cards>=0.2.0",
]
online = [
    "streamlit>=1.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",
    "E701", # Multiple statements on one line (colon)
    "E402" # Module level import not at top of file
    ]

[tool.coverage.run]
branch = true
source = ["cardgame"]
